<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel War Mobile - Studio</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* Empêche les gestes par défaut du navigateur */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f17;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 22, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 96vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .title-badge {
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(135deg, #89b4fa, #cba6f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .palette {
            display: flex;
            gap: 5px;
            align-items: center;
            max-width: 60vw;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .color-box {
            min-width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        .color-box.selected {
            border-color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .tools-group {
            display: flex;
            gap: 6px;
            align-items: center;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 8px;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-tool.active {
            background: #89b4fa;
            color: #11111b;
            font-weight: bold;
        }

        .custom-color-picker {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        canvas {
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="toolbar">
        <span class="title-badge">🎨 PIXEL WAR</span>
        
        <div class="palette" id="palette">
            <div class="color-box selected" style="background: #ff0000;" data-color="#ff0000"></div>
            <div class="color-box" style="background: #ff6600;" data-color="#ff6600"></div>
            <div class="color-box" style="background: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-box" style="background: #00cc00;" data-color="#00cc00"></div>
            <div class="color-box" style="background: #006600;" data-color="#006600"></div>
            <div class="color-box" style="background: #00ffff;" data-color="#00ffff"></div>
            <div class="color-box" style="background: #0066ff;" data-color="#0066ff"></div>
            <div class="color-box" style="background: #0000ff;" data-color="#0000ff"></div>
            <div class="color-box" style="background: #6600cc;" data-color="#6600cc"></div>
            <div class="color-box" style="background: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-box" style="background: #ff99cc;" data-color="#ff99cc"></div>
            <div class="color-box" style="background: #8b4513;" data-color="#8b4513"></div>
            <div class="color-box" style="background: #ffffff;" data-color="#ffffff"></div>
            <div class="color-box" style="background: #000000;" data-color="#000000"></div>
        </div>

        <input type="color" id="customColor" class="custom-color-picker" value="#ff0000">

        <div class="tools-group">
            <button class="btn-tool active" id="btnBrush">✏️</button>
            <button class="btn-tool" id="btnEraser">🧹</button>
            <button class="btn-tool" id="btnPicker">🧪</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const SUPABASE_URL = "https://gaecxfiykubxejoufsfu.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZWN4Zml5a3VieGVqb3Vmc2Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTgxMDksImV4cCI6MjEwNDk3NDEwOX0.2lidxjHfVW3xTNmH8VDsRQEjKd0aJum-kU8br-TZ3Zw";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const GRID_WIDTH = 200;
        const GRID_HEIGHT = 200;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gridData = new Uint32Array(GRID_WIDTH * GRID_HEIGHT);
        gridData.fill(0xFFFFFFFF);

        let scale = 3;
        let offsetX = (canvas.width - GRID_WIDTH * scale) / 2;
        let offsetY = (canvas.height - GRID_HEIGHT * scale) / 2;
        
        let isDragging = false;
        let isDrawing = false;
        let startX, startY;
        let currentMode = 'brush';
        let selectedColor = '#ff0000';
        let lastGridX = null, lastGridY = null;
        let initialPinchDistance = null;
        let initialScale = scale;

        function hexToUint32(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0xFF << 24) | (b << 16) | (g << 8) | r;
        }

        function uint32ToHex(uint32) {
            const r = (uint32 & 0xFF).toString(16).padStart(2, '0');
            const g = ((uint32 >> 8) & 0xFF).toString(16).padStart(2, '0');
            const b = ((uint32 >> 16) & 0xFF).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        const palette = document.getElementById('palette');
        const customColorPicker = document.getElementById('customColor');
        const btnBrush = document.getElementById('btnBrush');
        const btnEraser = document.getElementById('btnEraser');
        const btnPicker = document.getElementById('btnPicker');

        function setMode(mode) {
            currentMode = mode;
            [btnBrush, btnEraser, btnPicker].forEach(b => b.classList.remove('active'));
            if (mode === 'brush') btnBrush.classList.add('active');
            if (mode === 'eraser') btnEraser.classList.add('active');
            if (mode === 'picker') btnPicker.classList.add('active');
        }

        btnBrush.addEventListener('click', () => setMode('brush'));
        btnEraser.addEventListener('click', () => setMode('eraser'));
        btnPicker.addEventListener('click', () => setMode('picker'));

        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-box')) {
                document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedColor = e.target.getAttribute('data-color');
                customColorPicker.value = selectedColor;
                setMode('brush');
            }
        });

        customColorPicker.addEventListener('input', (e) => {
            document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
            selectedColor = e.target.value;
            setMode('brush');
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        });

        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = GRID_WIDTH;
        offscreenCanvas.height = GRID_HEIGHT;
        const offscreenCtx = offscreenCanvas.getContext('2d');
        const imgData = offscreenCtx.createImageData(GRID_WIDTH, GRID_HEIGHT);
        const dataView = new Uint32Array(imgData.data.buffer);

        function draw() {
            ctx.fillStyle = '#0f0f17';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            dataView.set(gridData);
            offscreenCtx.putImageData(imgData, 0, 0);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offscreenCanvas, 0, 0);

            if (scale > 6) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 0.03;
                ctx.beginPath();
                for (let x = 0; x <= GRID_WIDTH; x++) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, GRID_HEIGHT);
                }
                for (let y = 0; y <= GRID_HEIGHT; y++) {
                    ctx.moveTo(0, y); ctx.lineTo(GRID_WIDTH, y);
                }
                ctx.stroke();
            }

            ctx.restore();
        }

        async function loadPixels() {
            const { data } = await _supabase.from('pixels').select('*');
            if (data) {
                data.forEach(p => {
                    const [x, y] = p.id.split('_').map(Number);
                    gridData[y * GRID_WIDTH + x] = hexToUint32(p.color);
                });
                draw();
            }
        }
        loadPixels();

        function drawLine(x0, y0, x1, y1, colorHex) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                if (x0 >= 0 && x0 < GRID_WIDTH && y0 >= 0 && y0 < GRID_HEIGHT) {
                    gridData[y0 * GRID_WIDTH + x0] = hexToUint32(colorHex);
                    _supabase.from('pixels').upsert({ id: `${x0}_${y0}`, color: colorHex });
                }

                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        function applyAction(gx, gy) {
            if (gx < 0 || gx >= GRID_WIDTH || gy < 0 || gy >= GRID_HEIGHT) return;

            if (currentMode === 'picker') {
                const colorUint = gridData[gy * GRID_WIDTH + gx];
                selectedColor = uint32ToHex(colorUint);
                customColorPicker.value = selectedColor;
                setMode('brush');
                return;
            }

            const colorToApply = (currentMode === 'eraser') ? '#ffffff' : selectedColor;

            if (lastGridX !== null && lastGridY !== null) {
                drawLine(lastGridX, lastGridY, gx, gy, colorToApply);
            } else {
                gridData[gy * GRID_WIDTH + gx] = hexToUint32(colorToApply);
                _supabase.from('pixels').upsert({ id: `${gx}_${gy}`, color: colorToApply });
            }

            lastGridX = gx;
            lastGridY = gy;
            draw();
        }

        // --- GESTION DU TACTILE (TOUCH EVENTS) ---
        function getDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const gx = Math.floor((e.touches[0].clientX - rect.left - offsetX) / scale);
                const gy = Math.floor((e.touches[0].clientY - rect.top - offsetY) / scale);
                applyAction(gx, gy);
            } else if (e.touches.length === 2) {
                isDrawing = false;
                isDragging = true;
                initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
                initialScale = scale;
                startX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - offsetX;
                startY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - offsetY;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();

            if (e.touches.length === 1 && isDrawing) {
                const gx = Math.floor((e.touches[0].clientX - rect.left - offsetX) / scale);
                const gy = Math.floor((e.touches[0].clientY - rect.top - offsetY) / scale);
                applyAction(gx, gy);
            } else if (e.touches.length === 2 && isDragging) {
                // Deplacement
                const currentMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const currentMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                offsetX = currentMidX - startX;
                offsetY = currentMidY - startY;

                // Zoom (Pinch)
                const currentDist = getDistance(e.touches[0], e.touches[1]);
                if (initialPinchDistance) {
                    let newScale = initialScale * (currentDist / initialPinchDistance);
                    scale = Math.max(0.8, Math.min(45, newScale));
                }
                draw();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            isDragging = false;
            lastGridX = null;
            lastGridY = null;
            initialPinchDistance = null;
        });

        // Event Souris pour PC
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2 || e.button === 1 || e.shiftKey) {
                isDragging = true;
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
            } else if (e.button === 0) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const gx = Math.floor((e.clientX - rect.left - offsetX) / scale);
                const gy = Math.floor((e.clientY - rect.top - offsetY) / scale);
                applyAction(gx, gy);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                draw();
            } else if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const gx = Math.floor((e.clientX - rect.left - offsetX) / scale);
                const gy = Math.floor((e.clientY - rect.top - offsetY) / scale);
                applyAction(gx, gy);
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isDrawing = false;
            lastGridX = null;
            lastGridY = null;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.15;
            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            newScale = Math.max(0.8, Math.min(45, newScale));

            offsetX = e.clientX - (e.clientX - offsetX) * (newScale / scale);
            offsetY = e.clientY - (e.clientY - offsetY) * (newScale / scale);
            scale = newScale;

            draw();
        }, { passive: false });

        draw();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel War - Hamza (2000x1500)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #11111b;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Barre d'outils fixe en haut */
        .toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: rgba(30, 30, 46, 0.95);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #444;
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .palette {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .color-box {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            box-sizing: border-box;
        }

        .color-box.selected {
            border-color: #ffffff;
            transform: scale(1.15);
        }

        /* Sélecteur de couleur personnalisé */
        .custom-color-picker {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .info {
            font-size: 12px;
            color: #aaa;
            border-left: 1px solid #444;
            padding-left: 10px;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <strong style="font-size: 15px;">🎮 Pixel War</strong>
        
        <!-- Palette avec 16 couleurs variées -->
        <div class="palette" id="palette">
            <div class="color-box selected" style="background: #ff0000;" data-color="#ff0000"></div>
            <div class="color-box" style="background: #ff6600;" data-color="#ff6600"></div>
            <div class="color-box" style="background: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-box" style="background: #00cc00;" data-color="#00cc00"></div>
            <div class="color-box" style="background: #006600;" data-color="#006600"></div>
            <div class="color-box" style="background: #00ffff;" data-color="#00ffff"></div>
            <div class="color-box" style="background: #0066ff;" data-color="#0066ff"></div>
            <div class="color-box" style="background: #0000ff;" data-color="#0000ff"></div>
            <div class="color-box" style="background: #6600cc;" data-color="#6600cc"></div>
            <div class="color-box" style="background: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-box" style="background: #ff99cc;" data-color="#ff99cc"></div>
            <div class="color-box" style="background: #8b4513;" data-color="#8b4513"></div>
            <div class="color-box" style="background: #ffffff;" data-color="#ffffff"></div>
            <div class="color-box" style="background: #aaaaaa;" data-color="#aaaaaa"></div>
            <div class="color-box" style="background: #555555;" data-color="#555555"></div>
            <div class="color-box" style="background: #000000;" data-color="#000000"></div>
        </div>

        <!-- Sélecteur personnalisé -->
        <input type="color" id="customColor" class="custom-color-picker" value="#ff0000" title="Choisir une couleur sur mesure">

        <div class="info">
            <span>🖱️ <b>Molette</b>: Zoom</span> | 
            <span>🖱️ <b>Clic droit / Molette</b>: Déplacer</span>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const GRID_WIDTH = 2000;
        const GRID_HEIGHT = 1500;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gridData = new Uint32Array(GRID_WIDTH * GRID_HEIGHT);
        gridData.fill(0xFFFFFFFF); // Fond blanc

        let scale = 1;
        let offsetX = (canvas.width - GRID_WIDTH) / 2;
        let offsetY = (canvas.height - GRID_HEIGHT) / 2;
        let isDragging = false;
        let startX, startY;
        let selectedColor = '#ff0000';

        function hexToUint32(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0xFF << 24) | (b << 16) | (g << 8) | r;
        }

        // Palette
        const palette = document.getElementById('palette');
        const customColorPicker = document.getElementById('customColor');

        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-box')) {
                document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedColor = e.target.getAttribute('data-color');
                customColorPicker.value = selectedColor;
            }
        });

        // Choix de couleur sur mesure
        customColorPicker.addEventListener('input', (e) => {
            document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
            selectedColor = e.target.value;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        });

        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = GRID_WIDTH;
        offscreenCanvas.height = GRID_HEIGHT;
        const offscreenCtx = offscreenCanvas.getContext('2d');
        const imgData = offscreenCtx.createImageData(GRID_WIDTH, GRID_HEIGHT);
        const dataView = new Uint32Array(imgData.data.buffer);

        function draw() {
            ctx.fillStyle = '#11111b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            dataView.set(gridData);
            offscreenCtx.putImageData(imgData, 0, 0);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offscreenCanvas, 0, 0);

            if (scale > 8) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 0.05;
                ctx.beginPath();
                for (let x = 0; x <= GRID_WIDTH; x += 10) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, GRID_HEIGHT);
                }
                for (let y = 0; y <= GRID_HEIGHT; y += 10) {
                    ctx.moveTo(0, y); ctx.lineTo(GRID_WIDTH, y);
                }
                ctx.stroke();
            }

            ctx.restore();
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2 || e.button === 1) {
                isDragging = true;
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
            } else if (e.button === 0) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const gridX = Math.floor((mouseX - offsetX) / scale);
                const gridY = Math.floor((mouseY - offsetY) / scale);

                if (gridX >= 0 && gridX < GRID_WIDTH && gridY >= 0 && gridY < GRID_HEIGHT) {
                    gridData[gridY * GRID_WIDTH + gridX] = hexToUint32(selectedColor);
                    draw();
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.15;
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            newScale = Math.max(0.2, Math.min(50, newScale));

            offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
            offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
            scale = newScale;

            draw();
        }, { passive: false });

        draw();
    </script>
</body>
</html>

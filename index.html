<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel War - Hamza</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* Palette de couleurs */
        .palette {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #2b2b3b;
            padding: 10px;
            border-radius: 8px;
        }

        .color-box {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-box.selected {
            border-color: #ffffff;
            transform: scale(1.1);
        }

        /* Grille de pixels */
        #grid {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 1px;
            background-color: #555555;
            border: 3px solid #ffffff;
        }

        .pixel {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎮 Pixel War - Hamza 🎮</h1>
    <p>Clique sur une couleur puis sur la grille pour dessiner !</p>

    <!-- Palette de couleurs -->
    <div class="palette" id="palette">
        <div class="color-box selected" style="background: #ff0000;" data-color="#ff0000"></div>
        <div class="color-box" style="background: #00ff00;" data-color="#00ff00"></div>
        <div class="color-box" style="background: #0000ff;" data-color="#0000ff"></div>
        <div class="color-box" style="background: #ffff00;" data-color="#ffff00"></div>
        <div class="color-box" style="background: #ff00ff;" data-color="#ff00ff"></div>
        <div class="color-box" style="background: #00ffff;" data-color="#00ffff"></div>
        <div class="color-box" style="background: #000000;" data-color="#000000"></div>
        <div class="color-box" style="background: #ffffff;" data-color="#ffffff"></div>
    </div>

    <!-- Grille de pixels -->
    <div id="grid"></div>

    <script>
        let selectedColor = '#ff0000';

        // Gestion de la palette
        const palette = document.getElementById('palette');
        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-box')) {
                document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedColor = e.target.getAttribute('data-color');
            }
        });

        // Creation de la grille 20x20
        const grid = document.getElementById('grid');
        for (let i = 0; i < 400; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.addEventListener('click', () => {
                pixel.style.backgroundColor = selectedColor;
            });
            grid.appendChild(pixel);
        }
    </script>
</body>
</html>
